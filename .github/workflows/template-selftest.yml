# テンプレート自身の検査。スタックを選ぶと(init-stack)、このファイルは消える。
# 各スタックを一時コピーに展開し、標準の入口をすべて通す。
name: Template self-test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stack:
    name: stack / ${{ matrix.stack }}
    strategy:
      fail-fast: false
      matrix:
        stack: [web-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Select the stack in this copy
        run: node scripts/init-stack.mjs ${{ matrix.stack }}
      - run: node scripts/factory-run.mjs install
      - run: node scripts/factory-run.mjs fast
      - run: node scripts/factory-run.mjs acceptance
      - run: node scripts/factory-run.mjs security
      - run: node scripts/factory-run.mjs e2e
